version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: matrimony-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-matrimony}
      POSTGRES_USER: ${DB_USERNAME:-matrimony}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrimony -d matrimony"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
