spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-algorithms-987654321
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  rate-limit:
    enabled: false
